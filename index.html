<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <title>ابزار عکس محصول — گام ۳</title>
</head>
<body>
  <h1>گام ۳ — کادر مربع</h1>
  <p>عکس وسط کادر سفید ۱۰۰۰×۱۰۰۰ قرار می‌گیرد. هنوز ذخیره نمی‌شود.</p>
  <label>
    انتخاب عکس
    <input id="photo" type="file" accept="image/*" />
  </label>
  <p id="status">عکسی انتخاب نشده.</p>
  <img id="preview" alt="" />
  <script>
    var SIZE = 1000;
    var input = document.querySelector("#photo");
    var status = document.querySelector("#status");
    var preview = document.querySelector("#preview");

    input.addEventListener("change", function () {
      var file = input.files && input.files[0];
      if (!file) {
        preview.removeAttribute("src");
        status.textContent = "عکسی انتخاب نشده.";
        return;
      }
      var src = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        var canvas = document.createElement("canvas");
        canvas.width = SIZE;
        canvas.height = SIZE;
        var ctx = canvas.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, SIZE, SIZE);
        var scale = Math.min(SIZE / img.width, SIZE / img.height);
        var w = img.width * scale;
        var h = img.height * scale;
        ctx.drawImage(img, (SIZE - w) / 2, (SIZE - h) / 2, w, h);
        URL.revokeObjectURL(src);
        var stem = file.name.replace(/\.[^.]+$/, "").trim() || "product";
        preview.src = canvas.toDataURL("image/jpeg", 0.9);
        preview.alt = stem + "-1000.jpg";
        status.textContent = "نام فایل: " + stem + "-1000.jpg";
      };
      img.src = src;
    });
  </script>
</body>
</html>
