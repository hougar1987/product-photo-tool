<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <title>ابزار عکس محصول — گام ۲</title>
</head>
<body>
  <h1>گام ۲ — نمایش عکس</h1>
  <p>عکس را انتخاب کنید. همان فایل روی صفحه نشان داده می‌شود.</p>
  <label>
    انتخاب عکس
    <input id="photo" type="file" accept="image/*" />
  </label>
  <p id="status">عکسی انتخاب نشده.</p>
  <img id="preview" alt="" />
  <script>
    var input = document.querySelector("#photo");
    var status = document.querySelector("#status");
    var preview = document.querySelector("#preview");
    var currentUrl = "";
    input.addEventListener("change", function () {
      var file = input.files && input.files[0];
      if (currentUrl) URL.revokeObjectURL(currentUrl);
      if (!file) {
        currentUrl = "";
        preview.removeAttribute("src");
        status.textContent = "عکسی انتخاب نشده.";
        return;
      }
      currentUrl = URL.createObjectURL(file);
      preview.src = currentUrl;
      preview.alt = file.name;
      status.textContent = "انتخاب شد: " + file.name;
    });
  </script>
</body>
</html>
